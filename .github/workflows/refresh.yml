name: Refresh TikTok Drop

# Denne pozbiera najnovsie videa z 3 faceless fabrik (GitHub Releases), spravi
# QC (jas/ostrost/dlzka) a pregeneruje index.html. Bezi po rannych fabrikovych
# behoch (~00:31-05:02 UTC), aby mal cerstve videa.

on:
  schedule:
    - cron: "20 5 * * *"   # ~07:20 Bratislava
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet opencv-python-headless numpy Pillow

      - name: Collect + QC + build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python collect_tiktok.py
          python quality_check.py || echo "QC preskocene (best-effort)"
          python build_tiktok_page.py
          cp tiktok_drop.html index.html

      - name: Commit ak sa zmenilo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html tiktok_drop.json qc_raw.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "refresh drop $(date -u +%F)"; git push; }
